    <circle cx="315.00" cy="369.90" r="3.6"/>
    <circle cx="346.07" cy="346.07" r="3.6"/>
    <circle cx="369.90" cy="315.00" r="3.6"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#1f2933" text-anchor="middle" stroke="#ffffff" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke">
    <text x="412" y="258">0&#176;</text>
    <text x="391.6" y="152.5">30&#176;</text>
    <text x="363.7" y="116.3">45&#176;</text>
