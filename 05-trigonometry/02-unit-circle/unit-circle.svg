<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="unitCircleTitle unitCircleDesc">
  <title id="unitCircleTitle">The unit circle with the sixteen special angles</title>
  <desc id="unitCircleDesc">A circle of radius one centred at the origin, with points marked at every multiple of thirty degrees and of forty-five degrees. Each point is labelled outside the circle in degrees and inside the circle in radians. The coordinates of each marked point are the cosine and the sine of the angle shown.</desc>
