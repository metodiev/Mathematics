  </g>
  <g fill="#9aa5b1">
    <polygon points="440,240 427,235 427,245"/>
    <polygon points="240,40 235,52 245,52"/>
  </g>

  <circle cx="240" cy="240" r="150" fill="none" stroke="#1f2933" stroke-width="2"/>

  <g fill="#1f2933">
