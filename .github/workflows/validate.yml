name: Validate content

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate indexes and fail if they are stale
        run: |
          python tools/build_indexes.py
          git --no-pager diff --ignore-cr-at-eol --stat
          if ! git diff --ignore-cr-at-eol --quiet; then
            echo "Index files are out of date. Run 'python tools/build_indexes.py' and commit the result."
            exit 1
          fi

      - name: Validate links, fences, Mermaid labels and exercise parity
        run: python tools/validate_repo.py
